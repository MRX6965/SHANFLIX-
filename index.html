<style>
:root{
  --bg:#141414;--bg-black:#000;--red:#e50914;--red-hover:#f6121d;--red-dark:#b20710;
  --card:#1f1f1f;--card-hover:#2a2a2a;--text:#ffffff;--muted:#b3b3b3;--dim:#8c8c8c;
  --line:rgba(255,255,255,.12);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;}
body{
  background:var(--bg);color:var(--text);
  font-family:Inter,"Helvetica Neue",Arial,sans-serif;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeSpeed;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;overscroll-behavior-y:none;
}
button,input,select{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
img{content-visibility:auto;-webkit-user-drag:none;}

header{
  height:calc(68px + var(--safe-top));
  padding:var(--safe-top) calc(4% + var(--safe-right)) 0 calc(4% + var(--safe-left));
  display:flex;align-items:center;justify-content:space-between;
  position:fixed;top:0;left:0;width:100%;z-index:100;
  background:linear-gradient(180deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.55) 60%,rgba(0,0,0,0) 100%);
  transition:background .35s ease;contain:layout style;
}
header.scrolled{background:#141414;box-shadow:0 2px 18px rgba(0,0,0,.65)}
.logo{font-family:'Bebas Neue',Impact,sans-serif;font-size:34px;letter-spacing:1.5px;color:var(--red);line-height:1;text-shadow:0 0 22px rgba(229,9,20,.35);user-select:none;flex-shrink:0;}
nav{display:flex;gap:22px;margin-left:34px;margin-right:auto}
nav a{color:#e5e5e5;text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer;transition:color .2s;touch-action:manipulation}
nav a:hover{color:var(--muted)}
.header-right{display:flex;gap:12px;align-items:center}

.search-container{position:relative;width:220px;display:flex;align-items:center;transition:width .3s ease}
.search-container:focus-within{width:280px}
.search-icon{position:absolute;left:12px;color:#b3b3b3;display:flex;align-items:center;justify-content:center;pointer-events:none}
.search{width:100%;padding:9px 34px 9px 38px;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:4px;outline:none;font-size:16px;transition:border-color .3s, background .3s;-webkit-appearance:none;appearance:none;}
.search::placeholder{color:#b3b3b3}
.search:focus{border-color:#fff;background:#000}
.clear-search{position:absolute;right:10px;color:#b3b3b3;background:transparent;border:none;font-size:22px;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0 6px;line-height:1;width:32px;height:32px;}
.clear-search:hover{color:#fff}
.search-results{position:absolute;top:calc(100% + 8px);left:0;width:100%;min-width:280px;background:rgba(20,20,20,.98);border:1px solid rgba(255,255,255,.15);border-radius:4px;max-height:380px;overflow-y:auto;z-index:200;display:none;box-shadow:0 10px 40px rgba(0,0,0,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.search-results.show{display:block}
.search-result-item{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;transition:background .2s;border-bottom:1px solid rgba(255,255,255,.06);touch-action:manipulation;}
.search-result-item:hover{background:rgba(255,255,255,.12)}
.search-result-poster{width:40px;height:60px;object-fit:cover;border-radius:3px;background:#000}
.search-result-info{flex:1;min-width:0}
.search-result-title{color:#fff;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result-meta{color:#b3b3b3;font-size:11px;margin-top:4px}
.search-no-results{padding:24px;text-align:center;color:#b3b3b3;font-size:13px}

.hero{position:relative;height:88vh;height:88dvh;min-height:600px;background:#000;overflow:hidden;contain:layout paint;}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease-in-out;display:flex;align-items:center;padding:120px 4% 130px;background-size:cover;background-position:center 20%;background-repeat:no-repeat;z-index:1;transform:translateZ(0);}
.hero-slide.active{opacity:1;z-index:2}
.hero-slide::before{content:"";position:absolute;inset:0;background:linear-gradient(77deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.72) 32%, rgba(0,0,0,.15) 68%, rgba(0,0,0,.35) 100%),linear-gradient(0deg, #141414 0%, rgba(20,20,20,.55) 22%, rgba(20,20,20,0) 55%);z-index:-1;}
.hero-content{position:relative;z-index:2;max-width:620px;transform:translateY(20px);transition:transform .6s ease}
.hero-slide.active .hero-content{transform:translateY(0)}
.tag{display:inline-flex;align-items:center;gap:9px;color:#fff;font-size:12px;font-weight:700;letter-spacing:4px;margin-bottom:18px}
.tag .tag-n{font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;letter-spacing:0;color:var(--red);line-height:1}
.hero h1{font-size:clamp(42px,7vw,82px);font-weight:800;line-height:1.02;letter-spacing:-2px;margin-bottom:18px;text-shadow:0 4px 20px rgba(0,0,0,.8)}
.hero-meta{display:flex;align-items:center;gap:12px;font-size:13.5px;color:#d6d6d6;margin-bottom:16px;font-weight:500;flex-wrap:wrap}
.hero-meta .match{color:#46d369;font-weight:700}
.hero-meta .badge{border:1px solid rgba(255,255,255,.5);padding:1px 7px;font-size:11px;border-radius:2px}
.hero-meta .badge-upcoming{background:#f5a623;color:#000;border-color:#f5a623;font-weight:800}
.hero p{color:#d2d2d2;font-size:15.5px;line-height:1.75;max-width:500px;margin-bottom:26px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 10px rgba(0,0,0,.8);}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.primary-btn{padding:13px 30px;border-radius:4px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:9px;background:#fff;color:#000;transition:background .2s;touch-action:manipulation;-webkit-user-select:none;user-select:none;}
.primary-btn:hover{background:#d9d9d9}
.primary-btn.notify-btn{background:#f5a623;color:#000}
.primary-btn.notify-btn:hover{background:#ffb733}

.section{padding:26px 4% 10px;position:relative;z-index:5;background:var(--bg)}
.section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px}
.section-heading h2{font-size:21px;font-weight:700;letter-spacing:.2px}
.section-heading span{color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:2.5px}

.category-list{display:flex;gap:10px;overflow-x:auto;padding:2px 0 20px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.category-list::-webkit-scrollbar{display:none}
.category-btn{background:transparent;color:#d2d2d2;border:1px solid rgba(255,255,255,.28);border-radius:3px;padding:7px 17px;font-size:12.5px;font-weight:600;white-space:nowrap;transition:.2s;touch-action:manipulation;}
.category-btn:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.08)}
.category-btn.active{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 18px rgba(229,9,20,.45)}

.movie-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px;padding-bottom:20px;}
.movie-card{min-width:0;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.3,1);position:relative;contain:layout style;touch-action:manipulation;will-change:transform;}
.movie-card:hover{transform:translateY(-6px);z-index:3;}
.poster{width:100%;aspect-ratio:2/3;border-radius:10px;overflow:hidden;position:relative;background:#1f1f1f;border:1px solid rgba(255,255,255,0.08);box-shadow:0 4px 15px rgba(0,0,0,0.6);transition:all .3s ease;}
.movie-card:hover .poster{box-shadow:0 12px 30px rgba(229,9,20,0.25), 0 0 0 2px var(--red);border-color:transparent;}
.poster img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;display:block;}
.movie-card:hover .poster img{transform:scale(1.08);}
.poster::before{content:"▶";position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;background:rgba(0,0,0,.5);opacity:0;transition:opacity .25s;backdrop-filter:blur(2px);}
.movie-card:hover .poster::before{opacity:1;}
.poster-label{position:absolute;top:10px;left:10px;z-index:3;background:var(--red);color:#fff;padding:4px 8px;border-radius:4px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;box-shadow:0 2px 8px rgba(0,0,0,0.5);}
.poster-status{position:absolute;top:10px;right:10px;z-index:3;padding:4px 8px;border-radius:4px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;box-shadow:0 2px 8px rgba(0,0,0,.6);}
.poster-status.upcoming{background:#f5a623;color:#000}
.poster-status.completed{background:#46d369;color:#000}
.movie-info{padding:12px 4px 0;}
.movie-info h3{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;line-height:1.3;}
.movie-info p{font-size:11.5px;color:#9e9e9e;margin-top:6px;font-weight:500;display:flex;align-items:center;gap:4px;}
.movie-info p span.star{color:#f5a623;font-size:10px;}

.skeleton-card{aspect-ratio:2/3;border-radius:10px;background:linear-gradient(90deg,#1f1f1f 25%,#2a2a2a 50%,#1f1f1f 75%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite;}
.skeleton-text{background:linear-gradient(90deg,#1f1f1f 25%,#2a2a2a 50%,#1f1f1f 75%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:4px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

footer{margin-top:70px;padding:48px 4% calc(40px + var(--safe-bottom));background:var(--bg-black);border-top:1px solid #222;color:#757575;text-align:center;font-size:12px;content-visibility:auto;contain-intrinsic-size:1px 200px;}
footer .logo{font-size:28px;display:inline-block;margin-bottom:12px}
footer p{margin-top:8px;letter-spacing:.4px}
footer strong{color:var(--red)}

.modal{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.92);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
.modal.show{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{max-width:850px;margin:30px auto;background:#111;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 24px 80px rgba(0,0,0,.9);animation:popIn .3s cubic-bezier(.2,.9,.3,1);isolation:isolate;}
@keyframes popIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.close{position:absolute;right:16px;top:16px;z-index:10;width:40px;height:40px;border-radius:50%;color:#fff;background:rgba(0,0,0,.75);font-size:24px;display:flex;align-items:center;justify-content:center;transition:background .2s;border:1px solid rgba(255,255,255,.1);touch-action:manipulation;}
.close:hover{background:var(--red)}
.modal-player-wrap{width:100%;aspect-ratio:16/9;background:#000;position:relative;overflow:hidden;contain:layout paint;border-bottom:1px solid rgba(255,255,255,0.08);}
.video-frame{width:100%;height:100%;border:0;display:block;background:#000}
.player-placeholder{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#0a0a0a;color:#666;font-size:14px;font-weight:600;letter-spacing:2px;padding:20px;text-align:center;}
.player-placeholder > span{font-size:24px;color:#333;margin-bottom:10px}
.player-placeholder.coming-soon{background:linear-gradient(135deg,#1a1a1a 0%,#0a0a0a 100%);gap:0}
.player-placeholder.coming-soon .cs-icon{font-size:46px;color:var(--red);margin-bottom:18px;animation:pulseIcon 2s ease-in-out infinite;line-height:1}
.player-placeholder.coming-soon .cs-title{font-size:22px;font-weight:800;letter-spacing:6px;color:#fff;margin-bottom:12px}
.player-placeholder.coming-soon .cs-sub{font-size:11px;color:#777;letter-spacing:3px;font-weight:600}
@keyframes pulseIcon{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.65;transform:scale(1.1)}}

.modal-info-wrap{padding:24px 32px;background:#181818;border-bottom:1px solid #2a2a2a}
.modal-title-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:12px}
.modal-title-row h2{font-size:26px;font-weight:800;color:#fff;line-height:1.2;word-break:break-word}
.info-btn{color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;opacity:.8;flex-shrink:0}
.info-btn:hover{opacity:1}
.modal-meta-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#b3b3b3;font-weight:500;margin-bottom:24px;flex-wrap:wrap;gap:10px;}
.meta-left span{margin-right:8px}
.meta-left span.badge-hd{border:1px solid #666;padding:1px 5px;border-radius:2px;font-size:10px;font-weight:700}
.meta-left .badge-status{padding:1px 8px;border-radius:2px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.meta-left .badge-status.upcoming{background:#f5a623;color:#000}
.meta-left .badge-status.completed{background:#46d369;color:#000}
.season-count{color:#b3b3b3;font-size:12px}

.resources-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.resources-header h4{font-size:11px;color:#fff;letter-spacing:1.5px;font-weight:700}
.resources-header .help-icon{width:16px;height:16px;border-radius:50%;border:1px solid #666;display:flex;align-items:center;justify-content:center;font-size:10px;color:#666;cursor:pointer;}
.upload-info{font-size:12px;color:#b3b3b3;margin-bottom:20px}

.new-controls{display:flex;flex-direction:row;gap:12px;margin-bottom:20px;position:relative;z-index:50}
.custom-select{position:relative;flex:1;max-width:calc(50% - 6px)}
.select-trigger{width:100%;background:#222;color:#fff;border:1px solid #444;padding:10px 16px;border-radius:4px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:border-color .2s,background .2s;touch-action:manipulation;}
.select-trigger span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px;text-align:left}
.select-trigger:hover,.custom-select.open .select-trigger{border-color:#fff;background:#2a2a2a}
.select-trigger svg{width:12px;height:12px;flex-shrink:0;transition:transform .2s}
.custom-select.open .select-trigger svg{transform:rotate(180deg)}
.select-options{position:absolute;top:calc(100% + 4px);left:0;width:100%;background:#181818;border:1px solid #333;border-radius:4px;list-style:none;padding:6px 0;margin:0;box-shadow:0 8px 24px rgba(0,0,0,.9);display:none;max-height:200px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.custom-select.open .select-options{display:block;animation:dropFade .15s ease-out}
@keyframes dropFade{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.select-options li{padding:10px 16px;font-size:13px;color:#ccc;cursor:pointer;transition:background .2s,color .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;touch-action:manipulation;}
.select-options li:hover{background:#2a2a2a;color:#fff}
.select-options li.active{color:var(--red);font-weight:700}
.custom-select.fixed-language .select-trigger{cursor:default}
.custom-select.fixed-language .select-trigger svg{display:none}

.ep-grid{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;position:relative;z-index:10;padding-bottom:8px;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
.ep-grid::-webkit-scrollbar{display:none}
.ep-btn{width:50px;height:40px;border-radius:4px;background:#2a2a2a;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:.2s;border:1px solid transparent;flex-shrink:0;touch-action:manipulation;}
.ep-btn:hover{background:#3a3a3a}
.ep-btn.active{background:var(--red);border-color:var(--red);box-shadow:0 0 15px rgba(229,9,20,.4)}

/* ===== CAST SECTION STYLES ===== */
.cast-wrap {
  padding: 24px 32px 0;
  background: #181818;
}
.cast-wrap h3 {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 16px;
}
.cast-grid {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding-bottom: 20px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.cast-grid::-webkit-scrollbar {
  display: none;
}
.cast-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 80px;
  max-width: 80px;
  text-align: center;
}
.cast-img {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  background: #2a2a2a;
  border: 2px solid rgba(255,255,255,0.1);
  margin-bottom: 8px;
  transition: transform 0.2s, border-color 0.2s;
}
.cast-card:hover .cast-img {
  transform: scale(1.05);
  border-color: var(--red);
}
.cast-name {
  font-size: 12px;
  color: #fff;
  font-weight: 600;
  line-height: 1.2;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.cast-role {
  font-size: 10px;
  color: #888;
  margin-top: 2px;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
/* ===== END CAST SECTION STYLES ===== */

.more-like-wrap{padding:24px 32px 32px;background:#181818;content-visibility:auto;contain-intrinsic-size:1px 400px;}
.more-like-wrap h3{font-size:18px;font-weight:700;color:#fff;margin-bottom:16px}
.related-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));gap:16px;}
.related-card{cursor:pointer;transition:transform .3s ease;position:relative;touch-action:manipulation;}
.related-card:hover{transform:translateY(-4px);z-index:3;}
.related-poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:#1f1f1f;margin-bottom:10px;display:block;border:1px solid rgba(255,255,255,0.08);box-shadow:0 4px 15px rgba(0,0,0,0.6);transition:all .3s ease;}
.related-card:hover .related-poster{box-shadow:0 12px 30px rgba(229,9,20,0.25), 0 0 0 2px var(--red);border-color:transparent;transform:scale(1.05);}
.related-title{font-size:13px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top: 4px;}

.toast{position:fixed;bottom:calc(28px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(10px);background:#fff;color:#000;font-weight:700;font-size:13.5px;padding:13px 26px;border-radius:3px;z-index:400;display:none;box-shadow:0 10px 40px rgba(0,0,0,.7);max-width:90vw;text-align:center;}
.toast.show{display:block;animation:toastIn .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

let _scrollPos = 0;
let _scrollLocked = false;
function lockBodyScroll(){
  if(_scrollLocked) return;
  _scrollPos = window.scrollY || window.pageYOffset || 0;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${_scrollPos}px`;
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';

}

  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  window.scrollTo(0, _scrollPos);
  _scrollLocked = false;
}

async function cacheImage(url){
  if (!('caches' in window) || !url) return;
  try {
    const cache = await caches.open(IMG_CACHE_NAME);
    const hit = await cache.match(url);
    if (!hit) await cache.add(url);
  } catch(e){}
}
function prefetchImages(urls){
  if (!('caches' in window)) return;
  urls.slice(0, 8).forEach(u => { if (u) cacheImage(u); });
}
function readCache(){
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.data)) return null;
    return parsed.data;
  } catch(e) { return null; }
}
function writeCache(data){
  const doWrite = () => {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch(e){}
  };
  if ("requestIdleCallback" in window) requestIdleCallback(doWrite, { timeout: 2000 });
  else setTimeout(doWrite, 0);
}

function getStatus(item){
  const s = String(item.status || "").toLowerCase().trim();
  if (s === "upcoming") return "upcoming";
  if (s === "completed" || s === "complete" || s === "released" || s === "release") return "completed";
  return "";
}
function isUpcoming(item){ return getStatus(item) === "upcoming"; }

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function escapeAttribute(v){ return escapeHTML(v); }

function isValidEmbedUrl(value){
  try {
    const u = new URL(value);
    return u.protocol === "https:" || u.protocol === "http:";
  } catch(e) { return false; }
}

function preconnectToVideoDomain(url){
  try {
    const domain = new URL(url).origin;
    if (!document.querySelector(`link[rel="preconnect"][href="${domain}"]`)) {
      const link = document.createElement('link');
      link.rel = 'preconnect'; link.href = domain; link.crossOrigin = 'anonymous';
      document.head.appendChild(link);
      const dnsLink = document.createElement('link');
      dnsLink.rel = 'dns-prefetch'; dnsLink.href = domain;
      document.head.appendChild(dnsLink);
    }
  } catch(e){}
}

function showToast(msg){
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}

function buildVidLinkUrl(content, seasonIndex, episodeIndex){
  if (!content || !content.tmdbId) return null;
  const tmdbId = String(content.tmdbId).trim();
  if (!/^\d+$/.test(tmdbId)) return null;

  const cat = (content.category || "").toLowerCase();
  if (cat.includes("movie")) {
    return `https://vidlink.pro/movie/${tmdbId}`;
  }

  const season = content.seasons && content.seasons[seasonIndex];
  const episode = season && season.episodes && season.episodes[episodeIndex];
  if (!season || !episode) return null;

  const sNum = season.number || (seasonIndex + 1);
  const eNum = episode.number || (episodeIndex + 1);
  return `https://vidlink.pro/tv/${tmdbId}/${sNum}/${eNum}`;
}

function isAdBlockEnabled(){
  return new Promise((resolve) => {
    const bait = document.createElement('div');
    bait.className = 'ad-banner adsbox ad-placement pub_300x250 banner-ad';
    bait.id = 'ad-banner-check';
    bait.style.cssText = 'width:1px;height:1px;position:absolute;left:-9999px;top:-9999px;pointer-events:none;';
    bait.innerHTML = '&nbsp;';
    document.body.appendChild(bait);
    setTimeout(() => {
      const style = window.getComputedStyle(bait);
      const isBlocked =
        bait.offsetHeight === 0 || bait.offsetWidth === 0 || bait.clientHeight === 0 ||
        style.display === 'none' || style.visibility === 'hidden' || !bait.parentNode;
      try { bait.remove(); } catch(e){}
      resolve(isBlocked);
    }, 100);
  });
}

function showPreRollAd(container, onComplete){
  const baselineBodyNodes = new Set(Array.from(document.body.children));
  window.__shanflixAdBaseline = baselineBodyNodes;

  const adOverlay = document.createElement('div');
  adOverlay.className = 'ad-overlay';
  adOverlay.innerHTML = `
    <div class="ad-overlay-content">
      <div class="ad-label">Advertisement</div>
      <div class="ad-slot" id="adsterraSlot"></div>
      <div class="ad-timer">Video will start in <span id="adCountdown">${AD_DURATION}</span>s</div>
      <div class="ad-progress-bar" id="adProgressBar"></div>
    </div>
  `;
  container.innerHTML = '';
  container.appendChild(adOverlay);

  const slot = document.getElementById('adsterraSlot');
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(ADSTERRA_AD_CODE, 'text/html');
    slot.innerHTML = doc.body.innerHTML;
    doc.querySelectorAll('script').forEach(oldScript => {
      const newScript = document.createElement('script');
      Array.from(oldScript.attributes).forEach(attr => {
        newScript.setAttribute(attr.name, attr.value);
      });
      newScript.textContent = oldScript.textContent;
      slot.appendChild(newScript);
    });
  } catch(err){
    slot.innerHTML = '<div style="color:#666;font-size:13px;">Ad loading...</div>';
  }

  let secondsLeft = AD_DURATION;
  const countdownEl = document.getElementById('adCountdown');
  const progressBar = document.getElementById('adProgressBar');
  if (progressBar) progressBar.style.width = '0%';

  const tick = setInterval(() => {
    secondsLeft--;
    if (countdownEl) countdownEl.textContent = secondsLeft;
    if (progressBar) progressBar.style.width = ((AD_DURATION - secondsLeft) / AD_DURATION * 100) + '%';
    if (secondsLeft <= 0) {
      clearInterval(tick);
      try {
        slot.querySelectorAll('iframe').forEach(f => {
          try { f.src = 'about:blank'; } catch(e){}
        });
      } catch(e){}
      if (adOverlay.parentNode) adOverlay.remove();
      onComplete();
    }
  }, 1000);
}

function cleanAdGhostNodes(){
  try {
    const baseline = window.__shanflixAdBaseline;
    if (!baseline) return;
    const playerContainer = document.getElementById('playerContainer');
    const modal = document.getElementById('detailModal');
    const toast = document.getElementById('toast');
    const header = document.getElementById('mainHeader');

    Array.from(document.body.children).forEach(el => {
      if (baseline.has(el)) return;
      if (el === modal || el === toast || el === header) return;
      if (playerContainer && (el === playerContainer || playerContainer.contains(el))) return;
      try { el.remove(); } catch(e){}
    });

    document.querySelectorAll('body > div, body > iframe').forEach(el => {
      if (el === modal || el === toast || el === header) return;
      if (playerContainer && (el === playerContainer || playerContainer.contains(el))) return;
      try {
        const cs = window.getComputedStyle(el);
        if (cs.position === 'fixed' && (parseInt(cs.zIndex) || 0) > 100 &&
            el.id !== 'playerContainer' && !el.closest('#detailModal')) {
          el.remove();
        }
      } catch(e){}
    });
    window.__shanflixAdBaseline = null;
  } catch(e){}
}

    const up = isUpcoming(item);

      ? `<button class="primary-btn notify-btn" onclick="openDetails('${escapeAttribute(item.id)}')">🔔 Coming Soon</button>`
      : `<button class="primary-btn" onclick="openDetails('${escapeAttribute(item.id)}')">▶ Play</button>`;
    const statusBadge = up ? `<span class="badge badge-upcoming">Upcoming</span>` : `<span class="badge">HD</span>`;
    return `
      <div class="hero-slide ${isFirst ? 'active' : ''}" ${bgStyle} ${dataBg}>
        <div class="hero-content">
          <div class="tag"><span class="tag-n">S</span> SHANFLIX ORIGINAL</div>
          <h1>${escapeHTML(item.title)}</h1>
          <div class="hero-meta">
            <span class="match">98% Match</span>
            <span>${escapeHTML(item.year || "")}</span>
            <span class="badge">16+</span>
            ${statusBadge}
          </div>
          <p>${escapeHTML(item.description || "Discover your favourite movies, TV series and dramas.")}</p>
          <div class="hero-btns">${btn}</div>
        </div>
      </div>`;
  }).join("");

  prefetchImages(sliderItems.slice(1, 3).map(i => i.backdrop || i.poster));
  startSlider(sliderItems.length);
}

function startSlider(total){
  clearInterval(slideInterval);
  if (total <= 1) return;
  currentSlideIndex = 0;
  slideInterval = setInterval(() => {
    const slides = document.querySelectorAll(".hero-slide");
    if (!slides.length) return;
    slides[currentSlideIndex].classList.remove("active");
    currentSlideIndex = (currentSlideIndex + 1) % slides.length;
    const next = slides[currentSlideIndex];
    if (next.dataset.bg && !next.style.backgroundImage) {
      next.style.backgroundImage = `url('${next.dataset.bg}')`;
    }
    next.classList.add("active");
    const after = slides[(currentSlideIndex + 1) % slides.length];
    if (after && after.dataset.bg && !after.dataset.preloaded) {
      after.dataset.preloaded = "1";
      new Image().src = after.dataset.bg;
    }
  }, 6000);
}

/* ===== UPGRADED RENDER CAST FUNCTION (Fixes Images & Shows All Categories) ===== */
function renderCast(item) {
  const castWrap = document.getElementById("castWrap");
  const castGrid = document.getElementById("castGrid");
  
  // ১. সব ক্যাটাগরির জন্য ডেটা চেক করবে
  if (item.cast && Array.isArray(item.cast) && item.cast.length > 0) {
    castWrap.style.display = "block";
    
    castGrid.innerHTML = item.cast.map(c => {
      // নাম বের করা
      const name = typeof c === 'string' ? c : (c.name || c.original_name || "Unknown");
      
      let imgUrl = "";
      if (typeof c === 'object') {
        // ২. ছবির লিংক খুঁজবে (অ্যাডমিন প্যানেল থেকে 'profile' এ সেভ হয়)
        imgUrl = c.profile || c.image || c.img || c.photo || c.imageUrl || c.profile_path || "";
        
        // ৩. যদি TMDB-এর শুধু পাথ থাকে (যেমন: /abc.jpg), তবে সম্পূর্ণ লিংক বানাবে
        if (imgUrl && !imgUrl.startsWith('http') && imgUrl.length > 0) {
          imgUrl = `https://image.tmdb.org/t/p/w185${imgUrl.startsWith('/') ? '' : '/'}${imgUrl}`;
        }
      }
      
      // ৪. ছবি না থাকলে প্রথম অক্ষর দিয়ে প্লেসহোল্ডার বানাবে
      const fallbackImg = `https://placehold.co/150x150/2a2a2a/fff?text=${encodeURIComponent(name.charAt(0))}`;
      if (!imgUrl) {
        imgUrl = fallbackImg;
      }

      // চরিত্রের নাম (role বা character)
      const role = (typeof c === 'object' && (c.character || c.role)) ? (c.character || c.role) : "";
      
      // onerror-এ infinite loop আটকানোর জন্য this.onerror=null; যোগ করা হয়েছে
      return `
        <div class="cast-card">
          <img class="cast-img" src="${escapeAttribute(imgUrl)}" alt="${escapeAttribute(name)}" loading="lazy" 
               onerror="this.onerror=null; this.src='${fallbackImg}'">
          <div class="cast-name">${escapeHTML(name)}</div>
          ${role ? `<div class="cast-role">${escapeHTML(role)}</div>` : ''}
        </div>
      `;
    }).join("");
  } else {
    // ডেটা না থাকলে হাইড করে দিবে
    castWrap.style.display = "none";
  }
}
/* ===== END UPGRADED RENDER CAST FUNCTION ===== */

  ).join("");

async function playEpisode(seasonIndex, episodeIndex){
  if (!currentContent) return;
  const season = currentContent.seasons[seasonIndex];
  const episode = season && season.episodes ? season.episodes[episodeIndex] : null;
  currentEpisode = episode;

  const myToken = ++currentPlayToken;
  const container = document.getElementById("playerContainer");

  let sourceUrl = buildVidLinkUrl(currentContent, seasonIndex, episodeIndex);

  if (!sourceUrl && episode && episode.sources && typeof episode.sources === "object") {
    sourceUrl = episode.sources["Original"] ||
                Object.values(episode.sources).find(u => u) || null;
  }

  if (!sourceUrl) {
    container.innerHTML = '<div class="player-placeholder">TMDB ID is required for this title.</div>';
    showToast("TMDB ID missing — add it in Admin");
    renderEpisodes();
    return;
  }

  if (!isValidEmbedUrl(sourceUrl)) {
    container.innerHTML = '<div class="player-placeholder">Invalid video URL.</div>';
    showToast("Invalid video source");
    return;
  }

  preconnectToVideoDomain(sourceUrl);
  renderEpisodes();

  const adBlocked = await isAdBlockEnabled();
  if (myToken !== currentPlayToken) return;

  if (adBlocked) {
    loadVideoPlayer(container, sourceUrl, currentContent);
  } else {
    showPreRollAd(container, () => {
      if (myToken !== currentPlayToken) return;
      cleanAdGhostNodes();
      loadVideoPlayer(container, sourceUrl, currentContent);
    });
  }
}

function loadVideoPlayer(container, source, content){
  const bgImage = content.backdrop || content.poster || "";
  const bgStyle = bgImage ? `style="background-image: url('${escapeAttribute(bgImage)}');"` : "";

  container.innerHTML = `
    <div class="video-loader-overlay" id="videoLoaderOverlay" ${bgStyle}>
      <div class="video-loader-content">
        <div class="spinner"></div>
        <div class="video-loader-text">LOADING PLAYER...</div>
      </div>
    </div>
  `;

  const iframe = document.createElement("iframe");
  iframe.className = "video-frame";
  iframe.src = source;
  
  iframe.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media; orientation; gyroscope; accelerometer; clipboard-write";
  iframe.setAttribute("allowfullscreen", "true");
  iframe.setAttribute("webkitallowfullscreen", "true");
  iframe.setAttribute("mozallowfullscreen", "true");
  iframe.setAttribute("playsinline", "true");
  iframe.setAttribute("webkit-playsinline", "true");
  iframe.referrerPolicy = "strict-origin-when-cross-origin";

  const removeLoader = () => {
    const loader = document.getElementById("videoLoaderOverlay");
    if (loader) {
      loader.style.opacity = "0";
      setTimeout(() => loader.remove(), 300);
    }
  };

  iframe.addEventListener("load", removeLoader);
  setTimeout(removeLoader, 15000);
  container.appendChild(iframe);
}

async function loadRealtimeContent(){
  if (!rtdb) return;
  try {
    const [dSnap, sSnap, eSnap] = await Promise.all([
      rtdb.ref("dramas").once("value"),
      rtdb.ref("seasons").once("value"),
      rtdb.ref("episodes").once("value")
    ]);

    const dramasAll   = dSnap.val() || {};
    const seasonsAll  = sSnap.val() || {};
    const episodesAll = eSnap.val() || {};

    const categoryMap = { drama: "Drama", series: "TV Series", movie: "Movie", anime: "Anime" };

    const fresh = Object.keys(dramasAll)
      .filter(id => dramasAll[id] && dramasAll[id].published === true)
      .map(id => {
        const d = dramasAll[id];
        const typeKey = (d.type || "").toLowerCase();
        const category = categoryMap[typeKey] || "Drama";
        const isMovie  = typeKey === "movie";

        const tmdbId = 
          d.tmdbId || d.tmdb_id || d.tmdbID || d.tmdbid || d.tmdb ||
          (/^\d+$/.test(String(id)) ? String(id) : null);

        const toViewerSources = (srcObj) => {
          const out = {};
          if (srcObj && typeof srcObj === "object") {
            Object.values(srcObj).forEach(s => {
              if (s && s.url && s.label) out[s.label] = s.url;
            });
          }
          return out;
        };

        let viewerSeasons = [];
        if (isMovie) {
          const src = toViewerSources(d.sources);
          viewerSeasons = [{ 
            number: 1, 
            name: "Movie", 
            episodes: [{ number: 1, sources: src }] 
          }];
        } else {
          const dramaSeasons  = seasonsAll[id] || {};
          const dramaEpisodes = episodesAll[id] || {};
          const seasonArr = Object.keys(dramaSeasons)
            .map(sid => ({ id: sid, ...dramaSeasons[sid] }))
            .sort((a, b) => (a.number || 0) - (b.number || 0));

          viewerSeasons = seasonArr.map((season, sIdx) => {
            const epsRaw = dramaEpisodes[season.id] || {};
            const eps = Object.keys(epsRaw)
              .map(eid => ({ id: eid, ...epsRaw[eid] }))
              .filter(ep => ep.published !== false)
              .sort((a, b) => (a.number || 0) - (b.number || 0))
              .map((ep, eIdx) => ({ 
                number: ep.number || (eIdx + 1), 
                sources: toViewerSources(ep.sources) 
              }));
            return { 
              number: season.number || (sIdx + 1),
              name: season.title || `Season ${season.number || (sIdx + 1)}`, 
              episodes: eps 
            };
          });
        }

        return {
          id,
          tmdbId,
          title:       d.title || "",
          category,
          year:        d.year || "",
          rating:      d.rating || "",
          poster:      d.poster || "",
          backdrop:    d.backdrop || "",
          description: d.synopsis || "",
          status:      (d.status || "").toLowerCase(),
          published:   true,
          isSlider:    !!d.featured,
          seasons:     viewerSeasons,
          cast:        d.cast || []  /* ✅ NEW CAST DATA ADDED */
        };
      });

    const changed = JSON.stringify(fresh) !== JSON.stringify(allContent);
    allContent = fresh;
    writeCache(fresh);

    if (changed || !document.querySelector(".movie-card")) {
      renderContent();
      renderHeroSlider();
    }
  } catch (e) {
    console.error("Realtime DB error:", e);
    if (!allContent.length) {
      renderContent([]);
      renderHeroSkeleton();
    }
    showToast("Could not load from Firebase");
  }
}

});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    closeModal();
    document.getElementById("searchResults").classList.remove("show");
  }
});
</script>
</body>
</html>
