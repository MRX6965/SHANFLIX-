<style>
/* NETFLIX STYLE THEME */
:root {
  --bg: #000000;
  --bg2: #141414;
  --card: #181818;
  --card2: #2f2f2f;
  --netflix-red: #E50914;
  --netflix-red-hover: #f40612;
  --text: #ffffff;
  --text-muted: #b3b3b3;
  --line: rgba(255, 255, 255, 0.1);
  --glass-bg: rgba(0, 0, 0, 0.75);
  --glass-border: rgba(255, 255, 255, 0.15);
  --smooth: cubic-bezier(0.25, 0.1, 0.25, 1);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  overscroll-behavior-y: none;
  scroll-behavior: smooth;
  background: #000;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #000; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: #555; }

button, input, select { font: inherit; color: inherit; touch-action: manipulation; }
button { cursor: pointer; border: 0; background: none; }
a { text-decoration: none; color: inherit; }
img { display: block; }

/* App Container */
.app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  background: var(--bg);
}

/* Header & Search */
header {
  position: absolute; top: 0; left: 0; right: 0; z-index: 50;
  display: flex; align-items: center; gap: 12px; padding: 20px 16px;
  padding-top: calc(20px + env(safe-area-inset-top, 0px));
  transition: background 0.4s var(--smooth);
  background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
}

.logo {
  font-size: 24px; font-weight: 900; letter-spacing: 1px;
  color: var(--netflix-red);
  white-space: nowrap;
  font-family: 'Inter', sans-serif;
}

.searchbox {
  margin-left: auto; flex: 1; display: flex; align-items: center;
  background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 4px; padding: 0 12px; max-width: 220px;
  transition: all 0.3s var(--smooth);
}

.searchbox:focus-within {
  border-color: #fff;
  background: #000;
  max-width: 260px;
}

.searchbox input {
  flex: 1; min-width: 0; background: none; border: 0; outline: 0;
  padding: 10px 0; color: #fff; font-size: 14px; font-weight: 400;
}
.searchbox input::placeholder { color: #888; }

.search-clear {
  background: rgba(255, 255, 255, 0.2); border-radius: 50%; width: 20px; height: 20px;
  display: grid; place-items: center; color: #fff; font-size: 12px; line-height: 1;
  padding: 0; flex-shrink: 0; margin-left: 8px; transition: background 0.2s;
}
.search-clear:hover { background: rgba(255, 255, 255, 0.4); }
.search-clear.hidden { display: none !important; }

.search-cancel {
  background: none; color: #fff; font-size: 14px; font-weight: 500;
  padding: 8px 0 8px 8px; white-space: nowrap; flex-shrink: 0;
  display: none; transition: color 0.2s;
}
header.search-mode .search-cancel { display: block; }

header.search-mode {
  background: #000 !important;
  border-bottom: 1px solid #222;
}

/* Netflix-style Search Panel */
.search-panel {
  position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 45;
  background: #000;
  padding: calc(82px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  display: none;
}
.search-panel.active { display: block; animation: fadeIn 0.3s var(--smooth); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.search-panel-title { font-size: 18px; font-weight: 700; color: #fff; margin: 4px 0 18px; }

.search-trending-list { display: flex; flex-direction: column; gap: 8px; }
.search-trending-item {
  display: flex; align-items: center; gap: 16px; padding: 10px; border-radius: 4px;
  cursor: pointer; transition: background 0.2s;
  background: #141414; border: 1px solid transparent;
}
.search-trending-item:hover { background: #222; }
.search-trending-poster {
  width: 60px; height: 85px; border-radius: 4px; overflow: hidden; flex-shrink: 0;
  background: #333;
}
.search-trending-poster img { width: 100%; height: 100%; object-fit: cover; }
.search-trending-info { flex: 1; min-width: 0; }
.search-trending-info h4 { margin: 0 0 6px; font-size: 15px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-trending-meta { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-trending-play {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.3);
  display: grid; place-items: center; color: #fff; font-size: 14px;
  padding-left: 2px; flex-shrink: 0; transition: all 0.2s;
}
.search-trending-item:hover .search-trending-play {
  background: #fff; color: #000; border-color: #fff;
}

.search-results-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.search-result-card { cursor: pointer; min-width: 0; transition: transform 0.2s; }
.search-result-card:active { transform: scale(0.96); }
.search-result-poster {
  aspect-ratio: 2/3; border-radius: 4px; overflow: hidden;
  background: #333;
}
.search-result-poster img { width: 100%; height: 100%; object-fit: cover; }
.search-result-card h4 { margin: 10px 0 4px; font-size: 13px; font-weight: 600; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-result-card .info { font-size: 11px; color: var(--text-muted); }

.search-no-results { padding: 40px 20px; text-align: center; color: var(--text-muted); }
.search-no-results p { font-size: 15px; margin: 0 0 12px; line-height: 1.6; }
.search-no-results b { color: #fff; }
.search-no-results-sub { margin-top: 24px !important; font-size: 14px !important; color: #eee !important; font-weight: 600; }
.search-suggestions-list { list-style: none; padding: 0; margin: 0 auto; text-align: left; display: inline-block; }
.search-suggestions-list li { font-size: 13.5px; color: var(--text-muted); padding: 6px 0 6px 24px; position: relative; }
.search-suggestions-list li::before { content: "•"; position: absolute; left: 6px; color: var(--netflix-red); font-size: 18px; line-height: 1; }

/* Hero Section */
.hero {
  position: relative; display: flex; align-items: flex-end; min-height: 70vh; padding: 120px 20px 40px;
  background-size: cover; background-position: center top; background-repeat: no-repeat; overflow: hidden;
  padding-top: calc(120px + env(safe-area-inset-top, 0px));
}
.hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.1) 30%, rgba(0,0,0,0.8) 80%, #000 100%);
  pointer-events: none;
}
.hero-inner { position: relative; z-index: 1; width: 100%; animation: fadeIn 0.8s var(--smooth) both; }

.badge {
  display: inline-block; color: #fff; font-size: 11px; letter-spacing: 1.5px; font-weight: 700;
  background: var(--netflix-red);
  padding: 4px 8px; border-radius: 4px;
}
.hero h1 {
  font-size: clamp(34px, 9vw, 48px); line-height: 1.1; margin: 16px 0 12px;
  color: #fff; font-weight: 800;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}
.hero .sub {
  max-width: 100%; color: #ddd; line-height: 1.5; font-size: 14px; margin: 0 0 24px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
}
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: #ddd; font-size: 13px; margin-bottom: 20px; font-weight: 500; }
.meta b { color: #46d369; font-weight: 700; font-size: 15px; }
.dot { width: 4px; height: 4px; border-radius: 50%; background: #777; display: inline-block; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }

/* Buttons */
.btn {
  border-radius: 4px; padding: 12px 24px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px;
  background: #fff; color: #000;
  transition: background 0.2s, transform 0.1s;
}
.btn:hover { background: #e6e6e6; }
.btn:active { transform: scale(0.98); }
.btn.ghost {
  background: rgba(109, 109, 110, 0.7); color: #fff;
}
.btn.ghost:hover { background: rgba(109, 109, 110, 0.4); }

/* Main Content & Grid */
main { padding: 0 16px 80px; position: relative; z-index: 2; }
.section { margin: 20px 0; }
.heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h2 { font-size: 18px; margin: 0; font-weight: 700; color: #e5e5e5; }
.muted { color: var(--text-muted); font-size: 13px; font-weight: 500; }

.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.card {
  min-width: 0; cursor: pointer; transition: transform 0.3s var(--smooth);
}
.card:hover { transform: scale(1.05); z-index: 10; }

.poster {
  position: relative; aspect-ratio: 2/3; background: #333; border-radius: 4px; overflow: hidden;
  transition: all 0.3s;
}
.poster img { width: 100%; height: 100%; object-fit: cover; }

.poster span {
  position: absolute; top: 0; left: 0; background: var(--netflix-red); color: #fff; padding: 2px 6px;
  font-size: 9px; font-weight: 800; text-transform: uppercase;
  border-bottom-right-radius: 4px;
}
.hoverplay {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: rgba(0,0,0,0.4);
  opacity: 0; transition: opacity 0.3s; font-size: 32px; color: #fff; 
}
.card:hover .hoverplay { opacity: 1; }

.card h3 { font-size: 13px; margin: 8px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; color: #e5e5e5; }
.card .info { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.empty { padding: 40px 20px; text-align: center; color: var(--text-muted); grid-column: 1/-1; font-size: 14px; }

/* Footer */
footer {
  padding: 30px 20px 40px; padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  color: #777; font-size: 12px; line-height: 1.8; text-align: center;
}
footer strong { color: #555; font-size: 14px; letter-spacing: 1px; display: block; margin-bottom: 6px; }

/* Modal */
.modal {
  position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.8); overflow-y: auto; padding: 0;
  animation: fadeIn 0.3s var(--smooth);
  -webkit-overflow-scrolling: touch; display: flex; justify-content: center;
}
.modalbox {
  width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
  background: #141414; position: relative;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: slideUp 0.4s var(--smooth) both;
}
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.close {
  position: absolute; right: 16px; top: 16px; z-index: 3; background: rgba(0,0,0,0.6); color: #fff;
  border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 20px; line-height: 1;
  display: grid; place-items: center; transition: background 0.2s;
}
.close:hover { background: rgba(255,255,255,0.2); }

/* Player */
.player-wrap { position: relative; background: #000; }
.player { width: 100%; aspect-ratio: 16/9; border: 0; background: #000; display: block; object-fit: contain; }
.placeholder {
  aspect-ratio: 16/9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
  background: #000; color: #fff;
}
.placeholder strong { font-size: 18px; margin-bottom: 8px; font-weight: 700; }
.placeholder p { margin: 4px 0; font-size: 14px; color: #aaa; }
.placeholder small { font-size: 12px; color: #777; margin-top: 10px; word-break: break-all; }

/* Coming Soon Placeholder */
.coming-soon-placeholder {
  aspect-ratio: 16/9;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
  color: #fff;
  padding: 20px;
}
.coming-soon-placeholder svg {
  margin-bottom: 16px;
}
.coming-soon-placeholder h3 {
  font-size: 20px;
  font-weight: 700;
  margin: 0 0 8px;
  letter-spacing: 0.5px;
}
.coming-soon-placeholder p {
  font-size: 14px;
  color: #aaa;
  margin: 0;
}

.video-poster { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; cursor: pointer; }
.video-poster img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: opacity 0.3s; }
.video-poster:hover img { opacity: 0.9; }
.video-poster .big-play {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 60px; height: 60px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(5px);
  border: 2px solid #fff;
  color: #fff; font-size: 24px; display: grid; place-items: center; padding-left: 4px;
  transition: transform 0.2s;
}
.video-poster:hover .big-play { transform: translate(-50%, -50%) scale(1.1); background: rgba(255,255,255,0.3); }
.video-label {
  position: absolute; bottom: 16px; left: 16px; color: #fff; font-size: 13px; font-weight: 600;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
}
.video-badge-ad {
  position: absolute; top: 16px; left: 16px; background: var(--netflix-red); color: #fff; font-size: 11px; font-weight: 800;
  padding: 2px 8px; border-radius: 2px; letter-spacing: 1px; text-transform: uppercase;
}

/* Ad Preroll */
.preroll {
  position: fixed; inset: 0; z-index: 200; background: #000; display: flex; align-items: center; justify-content: center; padding: 20px;
}
.preroll.hidden { display: none !important; }
.preroll-box {
  width: 100%; max-width: 460px; background: #141414;
  border: 1px solid #333; border-radius: 8px; padding: 20px;
}
.preroll-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.preroll-label { background: #fff; color: #000; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 2px; letter-spacing: 1px; }
.preroll-timer {
  color: #fff; font-size: 15px; font-weight: 700; background: #333;
  padding: 4px 12px; border-radius: 4px; min-width: 60px; text-align: center;
}
.preroll-timer::after { content: 's'; opacity: 0.6; margin-left: 2px; font-weight: 400; }
.preroll-ad { background: #000; min-height: 280px; display: flex; align-items: center; justify-content: center; border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
.preroll-ad ins { width: 100%; min-height: 280px; display: block; }
.preroll-footer { display: flex; flex-direction: column; gap: 12px; }
.preroll-progress { width: 100%; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
.preroll-bar { height: 100%; width: 0%; background: var(--netflix-red); transition: width 0.1s linear; }
.preroll-note { text-align: center; color: #888; font-size: 12px; }

/* Drama Info & Details */
.info-bar { padding: 20px; background: #141414; border-bottom: 1px solid #222; }
.title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.dlg-title { font-size: 20px; font-weight: 700; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; }
.dlg-title .lang-tag { color: var(--netflix-red); font-weight: 700; font-size: 16px; }
.info-btn {
  background: transparent; border: 1px solid #555; color: #fff;
  padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
}
.info-btn:hover { border-color: #fff; }
.chev-btn { color: #fff; font-size: 20px; padding: 6px; transition: transform 0.3s; }
.chev-btn.rotated { transform: rotate(90deg); }

.meta-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: #aaa; font-size: 13px; margin-bottom: 16px; font-weight: 500; }
.meta-row .m-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.meta-row .m-item b { color: #46d369; font-weight: 700; }
.meta-row .sep { color: #444; }
.seasons-count { margin-left: auto; color: #aaa; font-size: 12px; white-space: nowrap; border: 1px solid #444; padding: 2px 8px; border-radius: 4px; }

.synopsis-box {
  background: #1f1f1f; border-radius: 4px;
  padding: 16px; font-size: 14px; line-height: 1.6; color: #ddd; margin-bottom: 20px;
}

.resources-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: baseline; margin-bottom: 16px; }
.res-label { font-weight: 700; color: #fff; font-size: 13px; }
.res-credit { font-size: 13px; color: #aaa; }
.res-credit b { color: #fff; }
.help-dot { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: #333; color: #888; font-size: 10px; margin-left: 4px; vertical-align: middle; }

/* NETFLIX STYLE CUSTOM SELECT & EPISODES */

.select-row { 
  display: flex; 
  gap: 10px; 
  flex-wrap: wrap; 
  margin-bottom: 16px; 
  position: relative; 
  z-index: 60; 
}
.sel-wrap { position: relative; flex: 1; min-width: 0; }
.custom-select { position: relative; width: 100%; user-select: none; }

/* Netflix Style Dropdown */
.select-trigger {
  width: 100%; 
  background: #2a2a2a; 
  border: 1px solid #404040; 
  color: #fff;
  padding: 10px 30px 10px 14px; 
  border-radius: 4px; 
  font-size: 13px; 
  font-weight: 500; 
  cursor: pointer;
  display: flex; 
  align-items: center; 
  justify-content: space-between;
  transition: background 0.2s;
}
.select-trigger:hover {
  background: #333;
}
.select-trigger::after { 
  content: "▼"; 
  color: #fff; 
  font-size: 10px; 
  transition: transform 0.2s; 
}
.custom-select.open .select-trigger::after { 
  transform: rotate(180deg); 
}

.select-options {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #141414; 
  border: 1px solid #404040; 
  border-radius: 4px; 
  z-index: 100;
  opacity: 0; visibility: hidden; transform: translateY(-5px); transition: all 0.2s;
  max-height: 240px; overflow-y: auto;
}
.custom-select.open .select-options { opacity: 1; visibility: visible; transform: translateY(0); }

.option {
  padding: 10px 14px; 
  font-size: 13px; 
  color: #aaa; 
  cursor: pointer; 
  transition: background 0.2s;
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
  font-weight: 400;
}
.option:hover { background: #333; color: #fff; }
.option.active { color: #fff; font-weight: 700; }
.option.active::after { content: "✓"; font-size: 14px; color: #fff; }

/* Netflix Style Episode Boxes */
.ep-chips { 
  display: flex; 
  gap: 8px; 
  flex-wrap: nowrap; 
  align-items: center; 
  overflow-x: auto; 
  scrollbar-width: none; 
  padding-bottom: 8px; 
}
.ep-chips::-webkit-scrollbar { display: none; }

.ep-chip {
  flex-shrink: 0; 
  background: #2a2a2a; 
  border: none; 
  color: #fff;
  padding: 10px 16px; 
  border-radius: 4px; 
  font-size: 14px; 
  font-weight: 500; 
  min-width: 44px; 
  text-align: center;
  transition: background 0.2s;
}
.ep-chip:hover { background: #404040; }
.ep-chip.active {
  background: #fff; 
  color: #000;
  font-weight: 700;
}

.season-eps-label { margin-left: 14px; flex-shrink: 0; font-size: 13px; color: #888; font-weight: 500; }

/* For You Section */
.foryou-section { padding: 24px 20px 40px; background: #141414; border-top: 1px solid #222; }
.foryou-title { font-size: 16px; margin: 0 0 16px; color: #e5e5e5; font-weight: 700; }
.foryou-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fy-card { cursor: pointer; min-width: 0; transition: transform 0.2s; }
.fy-card:hover { transform: scale(1.05); }
.fy-poster {
  aspect-ratio: 2/3; border-radius: 4px; overflow: hidden; background: #333;

function isUpcoming(d) {

function stopVideo(){

        el.src = "about:blank";
        el.removeAttribute("src");

        el.pause();
        el.removeAttribute("src");
        el.load();

}

function showPreroll(onComplete){
  const overlay = $("#preroll");
  const adContainer = $("#prerollAd");
  const timerEl = $("#prerollTimer");
  const barEl = $("#prerollBar");

  adContainer.innerHTML = `
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="${ADSENSE_CLIENT}"
         data-ad-slot="${ADSENSE_SLOT}"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>`;

  overlay.classList.remove("hidden");

  try { (window.adsbygoogle = window.adsbygoogle || []).push({}); }
  catch(e){ console.warn("AdSense:", e); }

  const totalMs = PREROLL_DURATION * 1000;
  const start = Date.now();
  timerEl.textContent = PREROLL_DURATION;
  barEl.style.width = "0%";

  if(prerollTimer) clearInterval(prerollTimer);
  prerollTimer = setInterval(() => {
    const elapsed = Date.now() - start;
    const pct = Math.min(100, (elapsed / totalMs) * 100);
    const secLeft = Math.max(0, Math.ceil((totalMs - elapsed) / 1000));
    barEl.style.width = pct + "%";
    timerEl.textContent = secLeft;

    if(elapsed >= totalMs){
      clearInterval(prerollTimer);
      prerollTimer = null;
      overlay.classList.add("hidden");
      adContainer.innerHTML = "";
      if(typeof onComplete === "function") onComplete();
    }
  }, 100);
}

function cancelPreroll(){

}

function render(){renderFeatured();renderGrid();}

function seasonsOf(d){return [...(d.seasons||[])].sort((a,b)=>Number(a.seasonNumber||1)-Number(b.seasonNumber||1))}
function episodesOf(s){return [...(s?.episodes||[])].sort((a,b)=>Number(a.episodeNumber||1)-Number(b.episodeNumber||1))}

function isPub(obj){
  if(!obj) return false;
  const v = obj.published ?? obj.isPublished ?? obj.is_published
         ?? obj.publish ?? obj.active ?? obj.visible ?? obj.enable;

  if(v !== undefined && v !== null && v !== ''){
    if(v === false || v === 0 || v === '0' || v === 'false') return false;
    const sv = String(v).toLowerCase().trim();
    if(['0','false','no','draft','unpublished','private','hidden',
        'pending','disabled','inactive'].includes(sv)) return false;
  }

  const st = obj.status;
  if(typeof st === 'string' &&
     ['draft','unpublished','private','hidden','pending','disabled','inactive']
       .includes(st.toLowerCase().trim())) return false;

  return true;
}

function normalizeLangName(name){
  if(!name) return 'Orginal';
  const s = String(name).trim();
  if(!s) return 'Orginal';
  const lower = s.toLowerCase();

  if (lower === 'original dub' || lower === 'original' || lower === 'english' || lower === 'eng') {
      return 'Orginal';
  }

  const map = {
    'original':'Orginal', 
    'orig':'Orginal',
    'kor':'Korean',
    'korean':'Korean',
    'hindi':'Hindi','hin':'Hindi',
    'tamil':'Tamil','tam':'Tamil',
    'telugu':'Telugu','tel':'Telugu',
    'english':'Orginal','eng':'Orginal',
    'malayalam':'Malayalam','mal':'Malayalam',
    'bengali':'Bengali','ben':'Bengali','bangla':'Bengali',
    'urdu':'Urdu','urd':'Urdu',
    'japanese':'Japanese','jpn':'Japanese','jap':'Japanese',
    'chinese':'Chinese','chi':'Chinese',
    'thai':'Thai','arabic':'Arabic',
    'dub':'Dub','sub':'Sub'
  };
  if(map[lower]) return map[lower];
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function loadSources(ep) {
  if (!ep) return [];
  const list = [];
  const seen = new Set();

  const addSource = (language, url) => {
    if (!url) return;
    url = String(url).trim();
    if (!url) return;
    const lang = normalizeLangName(language);
    const key = lang.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    list.push({ language: lang, embedUrl: url });
  };

  const getUrl = (s) => {
    if (typeof s === 'string') return s;
    if (!s || typeof s !== 'object') return '';
    let url = s.embedUrl ?? s.videoUrl ?? s.iframeUrl ?? s.url ?? s.link
           ?? s.src ?? s.embed ?? s.stream ?? s.file ?? s.iframe
           ?? s.href ?? s.path ?? s.video_url ?? s.embed_url
           ?? s.playUrl ?? s.play_url ?? s.dubUrl ?? s.dub_url;
    if (url && typeof url === 'object') {
      url = url.url ?? url.link ?? url.src ?? url.href ?? url.path ?? '';
    }
    return url || '';
  };

  const LANG_HINTS = ['hindi','tamil','telugu','english','korean','malayalam',
                      'bengali','urdu','original','japanese','chinese','thai','arabic'];

  const dubData = ep.dubs ?? ep.dub;
  if (dubData) {
    if (Array.isArray(dubData)) {
      dubData.forEach(item => {
        if (!item) return;
        if (typeof item === 'string') {
          addSource('Orginal', item);
        } else if (typeof item === 'object') {
          if (!isPub(item)) return;
          const lang = item.language || item.label || item.lang
                     || item.audio || item.name || 'Orginal';
          addSource(lang, getUrl(item));
        }
      });
    } else if (typeof dubData === 'object') {
      Object.entries(dubData).forEach(([langKey, data]) => {
        if (!data) return;
        if (typeof data === 'string') {
          addSource(langKey, data);
        } else if (typeof data === 'object') {
          if (!isPub(data)) return;
          const lang = data.language || data.label || data.lang
                     || data.audio || data.name || langKey;
          addSource(lang, getUrl(data));
        }
      });
    }
  }

  const sourceKeys = ['sources','videos','streams','links','servers','mirrors',
                      'audios','audio','tracks','files','qualities'];
  sourceKeys.forEach(key => {
    if (!ep[key]) return;
    const raw = ep[key];

    if (Array.isArray(raw)) {
      raw.forEach(s => {
        if (!s) return;
        if (typeof s === 'string') { addSource('Orginal', s); return; }
        if (typeof s === 'object') {
          if (!isPub(s)) return;
          const lang = s.language || s.label || s.lang
                     || s.audio || s.name || 'Orginal';
          addSource(lang, getUrl(s));
        }
      });
    } else if (typeof raw === 'object') {
      Object.entries(raw).forEach(([id, s]) => {
        if (!s) return;
        if (typeof s === 'string') {
          const isLang = LANG_HINTS.some(l => id.toLowerCase().includes(l));
          addSource(isLang ? id : 'Orginal', s);
        } else if (typeof s === 'object') {
          if (!isPub(s)) return;
          const isLang = LANG_HINTS.some(l => id.toLowerCase().includes(l));
          const lang = s.language || s.label || s.lang
                     || s.audio || s.name || (isLang ? id : 'Orginal');
          addSource(lang, getUrl(s));
        }
      });
    } else if (typeof raw === 'string') {
      addSource('Orginal', raw);
    }
  });

  if (list.length === 0) {
    const direct = ep.embedUrl ?? ep.videoUrl ?? ep.iframeUrl ?? ep.url
                 ?? ep.link ?? ep.src ?? ep.stream ?? ep.file ?? ep.iframe
                 ?? ep.player ?? ep.video_url ?? ep.embed_url;
    if (typeof direct === 'string') {
      addSource(ep.language || ep.lang || 'Orginal', direct);
    }
  }

  list.sort((a, b) => {
      const aIsOrig = a.language.toLowerCase().includes('orginal');
      const bIsOrig = b.language.toLowerCase().includes('orginal');
      if (aIsOrig && !bIsOrig) return -1;
      if (!aIsOrig && bIsOrig) return 1;
      return a.language.localeCompare(b.language);
  });

  return list;
}

function loadEpisodes(data) {
    if (!data) return [];
    let episodes = [];
    const vals = Array.isArray(data) ? data : Object.values(data);
    for (let i = 0; i < vals.length; i++) {
        let ep = vals[i];
        if (!ep || typeof ep !== 'object') continue;
        if (!isPub(ep)) continue;
        const srcs = loadSources(ep);
        episodes.push({
            id: ep.id || `ep_${i+1}`,
            ...ep,
            episodeNumber: Number(ep.number ?? ep.episodeNumber ?? ep.episode ?? (episodes.length + 1)),
            sources: srcs
        });
    }
    return episodes.sort((a, b) => (a.episodeNumber || 0) - (b.episodeNumber || 0));
}

function player(ep, src) {
    if (!ep) return '<div class="placeholder"><strong>▶ No episodes yet</strong><p>This drama has no episodes published.</p><small>Check back later.</small></div>';
    let url = src?.embedUrl || "";
    if (typeof url === 'object' && url !== null) url = url.url || url.link || url.src || "";
    url = String(url).trim();
    
    if (!url) return `<div class="placeholder"><strong>▶ ${safe(ep.title || "Episode " + (ep.episodeNumber || ""))}</strong><p>No video URL added.</p><small>Admin Panel-এ ভিডিও লিংক দেওয়া হয়নি।</small></div>`;
    try {
        let finalUrl = url;
        if (url.toLowerCase().includes('<iframe')) {
            const match = url.match(/src=["'](.*?)["']/i);
            if (match && match[1]) finalUrl = match[1];
        }
        
        return `<iframe class="player" src="${safe(finalUrl)}" title="${safe(ep.title || "Video player")}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write" allowfullscreen referrerpolicy="no-referrer"></iframe>`;
    } catch {
        return '<div class="placeholder">Invalid video embed URL.</div>';
    }
}

function setupCustomSelect(containerId, onSelect) {
  const container = document.getElementById(containerId);
  if(!container) return;
  const trigger = container.querySelector('.select-trigger');
  const options = container.querySelectorAll('.option');
  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.custom-select').forEach(el => { if(el !== container) el.classList.remove('open'); });
    container.classList.toggle('open');
  });
  options.forEach(opt => {
    opt.addEventListener('click', (e) => {
      e.stopPropagation();
      const val = opt.dataset.val; 
      const text = opt.textContent.replace('✓', '').trim();
      trigger.textContent = text;
      options.forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      container.classList.remove('open');
      if (onSelect) onSelect(val);
    });
  });
}

document.addEventListener('click', () => {
  document.querySelectorAll('.custom-select').forEach(el => el.classList.remove('open'));
});

function renderDetail() {
    const d = selected;
    if (!d) return;

    stopVideo();
    
    // চেক করা হচ্ছে ড্রামাটি আপকামিং কি না
    const upcoming = isUpcoming(d);

    const ss = seasonsOf(d);
    if (seasonIndex >= ss.length) seasonIndex = 0;
    const curSeason = ss[seasonIndex];
    const allEps = episodesOf(curSeason);

    const allLangs = new Set();
    allEps.forEach(ep => {
        loadSources(ep).forEach(src => {
            if (src.language) allLangs.add(src.language);
        });
    });

    const langList = Array.from(allLangs).sort((a, b) => {
        const aIsOrig = a.toLowerCase().includes('orginal');
        const bIsOrig = b.toLowerCase().includes('orginal');
        if (aIsOrig && !bIsOrig) return -1;
        if (!aIsOrig && bIsOrig) return 1;
        return a.localeCompare(b);
    });
    
    if (langList.length === 0) langList.push('Orginal');

    if (!selectedLangName || !langList.includes(selectedLangName)) {
        selectedLangName = langList[0];
    }

    const eps = allEps.filter(ep =>
        loadSources(ep).some(s => s.language === selectedLangName)
    );

    if (episodeIndex >= eps.length) episodeIndex = 0;
    const ep = eps[episodeIndex];
    
    const curSrcs = ep ? loadSources(ep) : [];
    const curSrc = curSrcs.find(s => s.language === selectedLangName) || curSrcs[0];

    currentEp = ep || null;
    currentSrc = curSrc || null;

    const seasonNum = curSeason ? (curSeason.seasonNumber || (seasonIndex + 1)) : 1;
    const totalSeasons = ss.length || 1;
    const forYou = dramas.filter(x => x.id !== d.id).slice(0, 6);
    
    // HTML টেম্পলেট তৈরি
    $("#detail").innerHTML = `
        <div class="player-wrap" id="videoArea">
            ${upcoming ? `
                <div class="coming-soon-placeholder">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#E50914" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <h3>Coming Soon</h3>
                    <p>Stay tuned! This title will be available soon.</p>
                </div>
            ` : buildVideoPoster(ep)}
        </div>

        <div class="info-bar">
            <div class="title-row">
                <h2 class="dlg-title">${safe(d.title)} ${!upcoming ? `<span class="lang-tag">[${safe(selectedLangName)}]</span> S${safe(seasonNum)}` : ''}</h2>
                <button class="info-btn" id="infoBtn">ⓘ Info</button>
                <button class="chev-btn" id="chevBtn" aria-label="More">❯</button>
            </div>

            <div class="meta-row">
                <span class="m-item"><b>HD</b></span><span class="sep">|</span>
                <span class="m-item">${safe(d.year || '—')}</span><span class="sep">|</span>
                <span class="m-item">${safe(d.country || 'South Korea')}</span><span class="sep">|</span>
                <span class="m-item">${safe(d.genres[0] || 'Drama')}</span>
                ${!upcoming ? `<span class="seasons-count">${totalSeasons} Season${totalSeasons > 1 ? 's' : ''}</span>` : ''}
            </div>

            <div class="synopsis-box hidden" id="synopsisBox">${safe(d.synopsis || 'No description available.')}</div>

            ${!upcoming ? `
                <div class="resources-row">
                    <span class="res-label">RESOURCES</span>
                    <span class="res-credit">Uploaded by <b>SHANFLIX</b> <span class="help-dot" title="Content provided by SHANFLIX">?</span></span>
                </div>

                <div class="select-row">
                    <div class="sel-wrap">
                        <div class="custom-select" id="langCustomSelect">
                            <div class="select-trigger">${safe(selectedLangName)}</div>
                            <div class="select-options">
                                ${langList.map((l) => `<div class="option ${l === selectedLangName ? 'active' : ''}" data-val="${safe(l)}">${safe(l)}</div>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="sel-wrap">
                        <div class="custom-select" id="seasonCustomSelect">
                            <div class="select-trigger">Season ${safe(ss[seasonIndex]?.seasonNumber || 1)}</div>
                            <div class="select-options">
                                ${ss.map((s, i) => `<div class="option ${i === seasonIndex ? 'active' : ''}" data-val="${i}">Season ${safe(s.seasonNumber || i + 1)}</div>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="ep-chips">
                    ${eps.map((e, i) => `<button class="ep-chip ${(i === episodeIndex) ? 'active' : ''}" data-ep="${i}">${String(e.episodeNumber || i + 1).padStart(2, '0')}</button>`).join('') || '<span class="muted">No episodes available</span>'}
                    <span class="season-eps-label">Episodes</span>
                </div>
            ` : ''}
        </div>

        <div class="foryou-section">
            <h3 class="foryou-title">More Like This</h3>
            <div class="foryou-grid">
                ${forYou.map(x => `
                    <div class="fy-card" data-fyid="${safe(x.id)}">
                        <div class="fy-poster"><img loading="lazy" decoding="async" src="${safe(x.poster || fallback)}" onerror="this.onerror=null;this.src='${fallback}'" alt="${safe(x.title)}"></div>
                        <div class="fy-title">${safe(x.title)}</div>
                    </div>
                `).join('') || '<div class="muted">No recommendations yet.</div>'}
            </div>
        </div>
    `;

    $("#playBtn")?.addEventListener("click", handlePlayClick);

    // শুধুমাত্র আপকামিং না হলে সেটআপ ফাংশন কল হবে
    if (!upcoming) {
        setupCustomSelect('langCustomSelect', (val) => {
            selectedLangName = val;
            episodeIndex = 0; 
            cancelPreroll();
            renderDetail();
        });

        setupCustomSelect('seasonCustomSelect', (val) => {
            seasonIndex = Number(val);
            episodeIndex = 0;
            cancelPreroll();
            renderDetail();
        });

        $("#detail").querySelectorAll("[data-ep]").forEach(b => b.addEventListener("click", () => { 
            episodeIndex = Number(b.dataset.ep); 
            cancelPreroll();
            renderDetail(); 
        }));
    }

    const toggleInfo = () => { $("#synopsisBox")?.classList.toggle("hidden"); $("#chevBtn")?.classList.toggle("rotated"); };
    $("#infoBtn")?.addEventListener("click", toggleInfo);
    $("#chevBtn")?.addEventListener("click", toggleInfo);

    $("#detail").querySelectorAll("[data-fyid]").forEach(el => el.addEventListener("click", () => {
        openDrama(el.dataset.fyid, false); 
        history.replaceState({ panel: 'modal' }, '');
    }));
}

function openDrama(id, pushHistory = true){
 stopVideo();
 selected=dramas.find(d=>d.id===id);
 if(!selected)return;

 if(pushHistory) {
     const isModalOpen = !$("#modal").classList.contains("hidden");
     if (isModalOpen) {
         history.replaceState({ panel: 'modal' }, '');
     } else {
         history.pushState({ panel: 'modal' }, '');
     }
 }

 seasonIndex=0;episodeIndex=0;
 selectedLangName=""; 
 cancelPreroll();
 renderDetail();
 $("#modal").classList.remove("hidden");
 document.body.style.overflow="hidden";
 $("#modal").scrollTop=0;
}

function closeModal(fromPopState = false){
  cancelPreroll();
  stopVideo();
  const detail = document.getElementById("detail");
  if(detail) detail.innerHTML = "";
  $("#modal").classList.add("hidden");
  document.body.style.overflow="";

  if (!fromPopState) {
    if (history.state && history.state.panel === 'modal') {
       history.back();
    }
  }
}

$("#close").addEventListener("click",()=>closeModal());
$("#modal").addEventListener("click",e=>{if(e.target===$("#modal"))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==="Escape"){closeModal();cancelPreroll();}});

document.addEventListener("visibilitychange", () => {
  if(document.hidden){
    document.querySelectorAll("#videoArea video, #videoArea audio, #detail video, #detail audio").forEach(m => {
      try { m.pause(); } catch(e){}
    });
  }
});

window.addEventListener("pagehide", stopVideo);
window.addEventListener("beforeunload", stopVideo);

window.addEventListener("scroll", () => {
  const header = document.getElementById("mainHeader");
  if (header.classList.contains("search-mode")) return;
  if (window.scrollY > 40) {
    header.style.background = "#000";
  } else {
    header.style.background = "linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%)";
  }
});

/* ============ SEARCH PANEL ============ */
const searchInput = $("#search");
const searchClear = $("#searchClear");
const searchCancel = $("#searchCancel");
const searchPanel = $("#searchPanel");
const mainHeader = document.getElementById("mainHeader");
let searchPanelOpen = false;

function openSearchPanel(){
  if(searchPanelOpen) return;
  searchPanelOpen = true;

  history.pushState({ panel: 'search' }, '');

  window.scrollTo(0, 0);
  mainHeader.style.background = "";
  mainHeader.classList.add("search-mode");
  searchPanel.classList.add("active");

  requestAnimationFrame(() => {
    const h = mainHeader.offsetHeight;
    searchPanel.style.paddingTop = h + "px";
  });

  document.body.style.overflow = "hidden";
  renderSearchPanel();
  if(window.matchMedia("(hover: none)").matches === false){ searchInput.focus(); }
}

function closeSearchPanel(fromPopState = false){
  if(!searchPanelOpen) return;
  searchPanelOpen = false;

  searchPanel.classList.remove("active");
  mainHeader.classList.remove("search-mode");
  searchPanel.innerHTML = "";
  searchPanel.style.paddingTop = "";

  searchInput.value = "";
  searchText = "";
  searchClear.classList.add("hidden");

  document.body.style.overflow = "";
  renderGrid();
  searchInput.blur();
  window.dispatchEvent(new Event('scroll'));

  if (!fromPopState) {
    if (history.state && history.state.panel === 'search') {
       history.back();
    }
  }
}

function clearSearch(e){
  if(e) e.stopPropagation();
  searchInput.value = "";
  searchText = "";
  searchClear.classList.add("hidden");
  renderSearchPanel();
  searchInput.focus();
}

function renderSearchPanel(){
  const q = searchInput.value.trim();
  searchText = q;

  if(!q){
    const top = dramas.slice(0, 8);
    searchPanel.innerHTML = `
      <h2 class="search-panel-title">Top Searches</h2>
      <div class="search-trending-list">
        ${top.map(d => `
          <div class="search-trending-item" data-searchid="${safe(d.id)}">
            <div class="search-trending-poster">
              <img src="${safe(d.poster || fallback)}" alt="${safe(d.title)}" loading="lazy" onerror="this.onerror=null;this.src='${fallback}'">
            </div>
            <div class="search-trending-info">
              <h4>${safe(d.title)}</h4>
            </div>
            <div class="search-trending-play">▶</div>
          </div>
        `).join('')}
      </div>
    `;
  } else {
    const ql = q.toLowerCase();
    const results = dramas.filter(d =>
      d.title.toLowerCase().includes(ql) ||
      d.genres.some(g => String(g).toLowerCase().includes(ql))
    );

    if(results.length === 0){
      searchPanel.innerHTML = `
        <div class="search-no-results">
          <p>Your search for "<b>${safe(q)}</b>" did not have any matches.</p>
          <p class="search-no-results-sub">Suggestions:</p>
          <ul class="search-suggestions-list">
            <li>Try different keywords</li>
            <li>Try using a movie or TV show title</li>
            <li>Try a genre, like Romance, Comedy, or Action</li>
          </ul>
        </div>
      `;
    } else {
      searchPanel.innerHTML = `
        <h2 class="search-panel-title">Results for "${safe(q)}"</h2>
        <div class="search-results-grid">
          ${results.map(d => `
            <div class="search-result-card" data-searchid="${safe(d.id)}">
              <div class="search-result-poster">
                <img src="${safe(d.poster || fallback)}" alt="${safe(d.title)}" loading="lazy" onerror="this.onerror=null;this.src='${fallback}'">
              </div>
              <h4>${safe(d.title)}</h4>
            </div>
          `).join('')}
        </div>
      `;
    }
  }

  searchPanel.querySelectorAll('[data-searchid]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.searchid;
      closeSearchPanel(true); 
      history.replaceState({ panel: 'modal' }, ''); 
      openDrama(id, false); 
    });
  });
}

searchInput.addEventListener("focus", () => { if(!searchPanelOpen) openSearchPanel(); });
searchInput.addEventListener("input", () => {
  const hasText = !!searchInput.value;
  searchClear.classList.toggle("hidden", !hasText);
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => { renderSearchPanel(); }, 80);
});

searchClear.addEventListener("click", clearSearch);
searchCancel.addEventListener("click", (e) => { e.stopPropagation(); closeSearchPanel(); });
document.addEventListener("keydown", (e) => { if(e.key === "Escape" && searchPanelOpen){ closeSearchPanel(); } });
window.addEventListener("resize", () => {
  if(searchPanelOpen){
    const h = mainHeader.offsetHeight;
    searchPanel.style.paddingTop = h + "px";
  }
});

window.addEventListener('popstate', (e) => {
  if (searchPanelOpen) {
    closeSearchPanel(true);
  } else if (!$("#modal").classList.contains("hidden")) {
    closeModal(true);
  }
});

async function start(){
 try{
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  const [snapDramas, snapSeasons, snapEpisodes] = await Promise.all([
      get(ref(db, "dramas")),
      get(ref(db, "seasons")).catch(()=>({val:()=>null})),
      get(ref(db, "episodes")).catch(()=>({val:()=>null}))
  ]);
  
  const rawDramas = snapDramas.val() || {};
  const rawSeasons = snapSeasons.val() || {};
  const rawEpisodes = snapEpisodes.val() || {};

  if(Object.keys(rawDramas).length === 0){ $("#dramas").innerHTML='<div class="empty">No data found.</div>'; return; }

  const full = [];
  for(const [dramaId, d] of Object.entries(rawDramas)){
    if(!d || typeof d !== 'object') continue;
    if(!isPub(d)) continue;

    const seasons = [];
    const dramaSeasons = rawSeasons[dramaId] || {};
    const dramaEpisodes = rawEpisodes[dramaId] || {};

    for(const [seasonId, sData] of Object.entries(dramaSeasons)){
        const seasonNum = Number(sData.number || sData.seasonNumber || 1);
        const episodesObj = dramaEpisodes[seasonId] || {};
        const epsList = [];
        for(const [epId, eData] of Object.entries(episodesObj)){
            epsList.push({
                id: epId,
                ...eData,
                episodeNumber: Number(eData.number || eData.episodeNumber || 1),
                sources: loadSources(eData)
            });
        }
        epsList.sort((a,b) => a.episodeNumber - b.episodeNumber);
        seasons.push({
            id: seasonId,
            seasonNumber: seasonNum,
            title: sData.title || `Season ${seasonNum}`,
            episodes: epsList
        });
    }
    seasons.sort((a,b) => a.seasonNumber - b.seasonNumber);
    
    if(seasons.length === 0) {
        const directEps = loadEpisodes(dramaEpisodes);
        if(directEps.length > 0) {
            seasons.push({id: 'season1', seasonNumber: 1, episodes: directEps});
        } else {
            seasons.push({id: 'season1', seasonNumber: 1, episodes: []});
        }
    }

    full.push(normalize({id: dramaId, ...d, seasons}));
  }

  dramas = full;
  render();
 }catch(error){
  console.error("Firebase error:", error);
  $("#dramas").innerHTML='<div class="empty">Data load failed. Check connection.</div>';
 }
}
start();
</script>
